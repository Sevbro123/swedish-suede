[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nhlmodel"
version = "0.1.0"
description = "NHL moneyline prediction research (analysis only; no wagering automation)"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.lock; these are the direct deps.
dependencies = [
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test hits a live endpoint (deselect with -m 'not network')"]
