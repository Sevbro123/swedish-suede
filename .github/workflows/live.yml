# Live predictions: bring the current season up to date, predict upcoming games, rebuild the site and
# publish it to the `site` branch (Vercel deploys that branch). Each run is a watcher (`nhlmodel.watch`):
# it runs the pipeline once, then stays up while games are due, polling the lineups of games about to start
# every minute and republishing as soon as one posts (dressed lineups appear only 5-15 min before puck drop).
# A watcher stays up only while a game starts within 90 min, and at most 3 h. GitHub starts scheduled runs
# late or drops them, so there are triggers every 30 min from 13:07 to 03:37 UTC (each game gets about three
# chances to start a watcher in time): triggers that arrive while a watcher is running wait as one pending
# run, which takes over when it stops. That covers matinees and late western games. Times are UTC.
name: live predictions

on:
  schedule:
    - cron: "7,37 13-23 * * *"
    - cron: "7,37 0-3 * * *"
  workflow_dispatch:

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Processed tables from the data branch
        run: |
          git fetch --depth=1 origin data
          mkdir -p data/processed
          git archive FETCH_HEAD processed | tar -x --strip-components=1 -C data/processed

      - name: Predictions and odds logs from the last published site
        run: |
          if git fetch --depth=1 origin site 2>/dev/null; then
            for f in predictions_log.csv odds_log.csv; do
              git show FETCH_HEAD:$f > data/processed/$f || rm -f data/processed/$f
            done
          fi

      # The raw NHL response cache carries over between runs, so each run downloads only new games.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: nhl-raw-${{ github.run_id }}
          restore-keys: nhl-raw-

      - name: Update, predict, build, publish; then watch for lineups
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nhlmodel.watch --publish scripts/publish_site.sh

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: nhl-raw-${{ github.run_id }}
