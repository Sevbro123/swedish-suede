<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swedish suede</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1424'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%232a9fd0' font-family='monospace'%3E%23%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: dark is the default look; light is opt-in from Settings ----------
     Series colors (--s1..3) were validated per mode with the dataviz palette checker and stay fixed
     under team themes; a team theme only recolors the chrome (bg, accents, field, logo). --good is
     the reserved "done / new" status color. */
  :root {
    color-scheme: dark;
    --bg: #0d1424; --card: #121b30; --card-2: #0f1729; --line: #22304d; --ink: #e6eefc; --ink-2: #a9b8d3; --muted: #8394b3;
    --s1: #2a9fd0; --s2: #8a72ea; --s3: #1fa57c;
    --accent: #2a9fd0; --accent-2: #8a72ea; --glow: rgba(42,159,208,.18); --good: #1fa57c; --logo-c: var(--s3);
    --field-a: 42,159,208; --field-b: 138,114,234; --field-alpha: .7;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f9fc; --card: #ffffff; --card-2: #f2f5fa; --line: #dde3ee; --ink: #0e1a2b; --ink-2: #46566f; --muted: #5d6d86;
    --s1: #1f6fd1; --s2: #b0389f; --s3: #0a8462;
    --accent: #1f6fd1; --accent-2: #b0389f; --glow: rgba(31,111,209,.12); --good: #0a8462;
    --field-a: 31,111,209; --field-b: 176,56,159; --field-alpha: .45;
    --shadow: 0 1px 2px rgba(14,26,43,.06), 0 18px 40px rgba(14,26,43,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif; overflow: hidden; }
  .mono, pre, button.mi, .chip, .hud { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  [hidden] { display: none !important; }

  #field { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: background .5s;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--bg) 35%, transparent), color-mix(in srgb, var(--bg) 70%, transparent)); }
  body[data-view="panel"] .veil { background: color-mix(in srgb, var(--bg) 78%, transparent); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; gap: 12px;
    padding: 12px 16px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .hud.top { top: 0; } .hud.bottom { bottom: 0; }
  .hud b { color: var(--accent); font-weight: 600; }
  .hud .brand { color: var(--ink); font-weight: 600; letter-spacing: .04em; }
  @media (max-width: 560px) { .hud .wide { display: none; } }

  #stage { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 48px 16px; }

  /* ---------- title screen ---------- */
  #title { text-align: center; }
  #logo { margin: 0 auto; font-weight: 800; line-height: 1.05; font-size: clamp(5px, 1.45vw, 15px);
    background: linear-gradient(90deg, var(--accent), var(--accent-2) 60%, var(--logo-c)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px var(--glow)); white-space: pre; display: inline-block; text-align: left; }
  @media (max-width: 700px) { #logo { font-size: clamp(6px, 2.9vw, 15px); } }
  #start { display: block; margin: 40px auto 0; font: 600 15px "JetBrains Mono", monospace; letter-spacing: .3em; color: var(--ink); background: none; border: 1px solid var(--line);
    padding: 12px 22px; border-radius: 10px; cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  #start:hover { border-color: var(--accent); background: var(--glow); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---------- main menu ---------- */
  #menu { width: min(560px, 100%); }
  .menu-head { font: 12px "JetBrains Mono", monospace; letter-spacing: .25em; color: var(--muted); margin: 0 0 10px 6px; }
  .menu-head b { color: var(--accent); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  button.mi { width: 100%; display: grid; grid-template-columns: 2ch 1fr auto; gap: 10px; align-items: center; text-align: left;
    background: none; border: 0; color: var(--ink-2); padding: 11px 12px; border-radius: 10px; cursor: pointer; font-size: 17px;
    transition: background .18s, color .18s, transform .18s; }
  button.mi .cur { color: var(--accent); opacity: 0; transition: opacity .15s; }
  button.mi[aria-current="true"] { color: var(--ink); background: color-mix(in srgb, var(--card) 80%, transparent); transform: translateX(6px);
    box-shadow: inset 0 0 0 1px var(--line); }
  button.mi[aria-current="true"] .cur { opacity: 1; }
  button.mi .lbl { letter-spacing: .08em; }
  button.mi .desc { display: block; font: 13px "Space Grotesk", sans-serif; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  button.mi.locked .lbl { color: var(--muted); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .chip.lock { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); }
  .keys { margin: 16px 6px 0; font-size: 12px; color: var(--muted); }
  .keys kbd { font: 11px "JetBrains Mono", monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

  /* ---------- panel ---------- */
  #panel { position: relative; width: min(1000px, 100%); max-height: calc(100vh - 96px); display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  #panel::before, #panel::after { content: "+"; position: absolute; font: 14px "JetBrains Mono", monospace; color: var(--accent); z-index: 3; }
  #panel::before { top: 4px; left: 8px; } #panel::after { bottom: 4px; right: 8px; }
  .p-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; border-bottom: 1px dashed var(--line); }
  #back { font: 13px "JetBrains Mono", monospace; color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; flex: none; }
  #back:hover { color: var(--ink); border-color: var(--accent); }
  .p-head h2 { margin: 0; font: 700 22px "Space Grotesk", sans-serif; letter-spacing: -.01em; }
  .p-head .idx { font: 13px "JetBrains Mono", monospace; color: var(--accent); }
  .p-body { position: relative; padding: 18px 20px 22px; overflow: auto; }
  #noise { position: absolute; inset: 0; margin: 0; z-index: 2; pointer-events: none; color: var(--accent); font-size: 13px; line-height: 1.15;
    overflow: hidden; background: color-mix(in srgb, var(--card) 92%, transparent); }
  .sub { color: var(--ink-2); margin: 0 0 16px; max-width: 72ch; }
  .card { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 > * { min-width: 0; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  h3 { margin: 0 0 10px; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); } .tile .v { font: 600 24px "JetBrains Mono", monospace; } .tile .s { font-size: 12px; color: var(--ink-2); }
  .prog { font: 13px "JetBrains Mono", monospace; color: var(--ink-2); overflow: hidden; white-space: nowrap; }
  .prog .tr { color: color-mix(in srgb, var(--ink) 25%, transparent); } .prog .fl { color: var(--accent); }
  .prog-head { display: flex; justify-content: space-between; font-size: 14px; }
  ol.phases { list-style: none; margin: 0; padding: 0; }
  ol.phases li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 15px; }
  ol.phases li:last-child { border-bottom: 0; }
  .ph-ico { font: 14px "JetBrains Mono", monospace; color: var(--muted); } .ph-ico.done { color: var(--good); } .ph-ico.wip { color: var(--accent); }

  /* table */
  .tbl-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { font-weight: 500; color: var(--ink-2); }
  table.data th button { all: unset; cursor: pointer; }
  table.data th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table.data th[aria-sort] button::after { content: " ."; color: var(--muted); font-family: "JetBrains Mono", monospace; }
  table.data th[aria-sort="ascending"] button::after { content: " ^"; color: var(--accent); }
  table.data th[aria-sort="descending"] button::after { content: " v"; color: var(--accent); }
  table.data tbody tr:hover { background: var(--glow); }

  /* experiments: ascii forest plot */
  .forest { font: 13px/1.6 "JetBrains Mono", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; overflow-x: auto; }
  .fr { display: grid; grid-template-columns: minmax(180px, 1.6fr) minmax(220px, 2fr) 72px; gap: 12px; align-items: center; padding: 3px 6px; border-radius: 8px; white-space: nowrap; }
  .fr:hover, .fr:focus-visible { background: var(--glow); }
  .fr .nm { overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .fr .nm .chip { margin-left: 6px; }
  .fr .ci, .axis span { color: var(--muted); letter-spacing: 0; white-space: pre; }
  .fr .ci b { color: var(--accent); font-weight: 600; }
  .fr.leaky .ci b { color: var(--accent-2); }
  .fr .v { text-align: right; color: var(--ink-2); }
  .axis { color: var(--muted); font-size: 12px; }
  @media (max-width: 620px) { .fr { grid-template-columns: 1fr 74px; } .fr .ci { grid-column: 1 / -1; } }

  /* locked + settings */
  .locked-box { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; padding: 10px 4px; }
  .locked-box pre { margin: 0; font-size: 14px; line-height: 1.1; color: var(--accent-2); }
  .locked-box h3 { font-size: 20px; margin: 0 0 6px; } .locked-box p { margin: 0 0 8px; color: var(--ink-2); }
  @media (max-width: 560px) { .locked-box { grid-template-columns: 1fr; } }
  .opt { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: 0; }
  .opt .d { color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { font: 13px "JetBrains Mono", monospace; background: none; border: 0; color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--glow); color: var(--ink); }
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; width: 100%; margin-top: 4px; }
  .teams button { display: flex; align-items: center; gap: 8px; font: 13px "JetBrains Mono", monospace; background: none; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; cursor: pointer; text-align: left; }
  .teams button:hover { border-color: var(--accent); color: var(--ink); }
  .teams button[aria-pressed="true"] { background: var(--glow); color: var(--ink); border-color: var(--accent); }
  .teams .dots { display: inline-flex; flex: none; }
  .teams .dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent); }
  .teams .dots i + i { margin-left: -4px; }
  .plain { margin: 0; padding-left: 18px; color: var(--ink-2); } .plain li { margin: 4px 0; }
  dl.gloss { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; color: var(--ink-2); font-size: 14px; }
  dl.gloss dt { color: var(--ink); font-weight: 500; } dl.gloss dd { margin: 0; }
  @media (max-width: 560px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { margin-bottom: 6px; } }
  .note { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .legend .sw { color: var(--c); font-family: "JetBrains Mono", monospace; margin-right: 6px; }
  /* upcoming games */
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .game { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .game .when { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .game .teams-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font: 600 18px "JetBrains Mono", monospace; }
  .game .teams-row .h { text-align: right; }
  .game .teams-row .at { font-size: 13px; color: var(--muted); font-weight: 400; }
  .game .tdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 6px; vertical-align: 1px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent); }
  .split { display: flex; height: 26px; margin: 10px 0 6px; gap: 2px; }
  .split span { display: flex; align-items: center; font: 600 13px "JetBrains Mono", monospace; color: var(--bg); padding: 0 8px; min-width: 0; overflow: hidden; }
  .split .a { background: var(--s2); border-radius: 6px 0 0 6px; }
  .split .h { background: var(--s1); border-radius: 0 6px 6px 0; justify-content: flex-end; }
  .game .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, transparent); }
  a.game { display: block; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.game:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game .more { margin-top: 10px; font: 12px "JetBrains Mono", monospace; color: var(--accent); letter-spacing: .06em; }
  body.calm a.game { transition: none; } body.calm a.game:hover { transform: none; }
  /* game explainer: diverging bars, away team pulls left, home team pulls right */
  .drv { display: grid; grid-template-columns: minmax(120px, 200px) 1fr 112px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 8px; }
  .drv:hover, .drv:focus-visible { background: var(--glow); }
  .drv .lab { font-size: 14px; color: var(--ink-2); } .drv .val { font: 13px "JetBrains Mono", monospace; text-align: right; white-space: nowrap; }
  .drv.axis-row { padding-top: 0; padding-bottom: 0; font: 12px "JetBrains Mono", monospace; color: var(--muted); }
  .drv.axis-row:hover { background: none; }
  .drv.axis-row .ends { display: flex; justify-content: space-between; }
  .dtrack { position: relative; height: 18px; }
  .dtrack::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--muted); }
  .dtrack i { position: absolute; top: 0; bottom: 0; }
  .dtrack i.h { left: 50%; background: var(--s1); border-radius: 0 4px 4px 0; }
  .dtrack i.a { right: 50%; background: var(--s2); border-radius: 4px 0 0 4px; }
  .tow-h { color: var(--s1); } .tow-a { color: var(--s2); }
  @media (max-width: 560px) { .drv { grid-template-columns: 1fr auto; } .drv .dtrack { grid-column: 1 / -1; grid-row: 2; }
    .drv.axis-row .lab, .drv.axis-row .val { display: none; } .drv.axis-row .ends { grid-column: 1 / -1; } }
  table.data td.stat { white-space: normal; min-width: 180px; }
  @media (max-width: 560px) { table.data td.stat { min-width: 0; } }
  ul.recent { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.recent li { display: grid; grid-template-columns: 82px 1fr auto auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
  ul.recent li:last-child { border-bottom: 0; }
  ul.recent .d { color: var(--muted); font: 12px "JetBrains Mono", monospace; }
  .right { color: var(--good); } .wrong { color: var(--accent-2); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filters select { font: 13px "JetBrains Mono", monospace; background: var(--card-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .btn { font: 13px "JetBrains Mono", monospace; background: none; border: 1px solid var(--line); color: var(--ink-2); padding: 6px 12px; border-radius: 9px; cursor: pointer; }

  /* toast + tooltip */
  #toast { position: fixed; z-index: 8; left: 50%; top: 52px; transform: translate(-50%, -12px); opacity: 0; transition: opacity .25s, transform .25s;
    font: 12px "JetBrains Mono", monospace; letter-spacing: .18em; color: var(--good); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 16px; box-shadow: var(--shadow); pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #tip { position: fixed; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .12s; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 13px; max-width: 280px; white-space: pre-line; }
  #tip.on { opacity: 1; }

  body.calm #start { animation: none; }
</style>
</head>
<body data-view="title">
<canvas id="field" aria-hidden="true"></canvas>
<div class="veil"></div>

<div class="hud top">
  <span class="brand">[#] swedish suede</span>
  <span class="wide">rev <span id="rev"></span></span>
</div>

<main id="stage">
  <section id="title" aria-label="Title screen">
    <pre id="logo" aria-label="swedish suede"></pre>
    <button id="start" type="button">PRESS START</button>
  </section>

  <nav id="menu" aria-label="Main menu" hidden>
    <div class="menu-head">MAIN MENU</div>
    <ul class="items" id="items" role="list"></ul>
    <div class="keys"><kbd>up</kbd> <kbd>down</kbd> move &nbsp; <kbd>enter</kbd> open &nbsp; <kbd>esc</kbd> back</div>
  </nav>

  <section id="panel" aria-labelledby="p-title" hidden>
    <div class="p-head">
      <button id="back" type="button">&lt; back</button>
      <span class="idx" id="p-idx"></span>
      <h2 id="p-title"></h2>
    </div>
    <div class="p-body" id="p-body"></div>
  </section>
</main>

<div class="hud bottom">
  <span>for analysis only &middot; not betting advice</span>
  <span class="wide" id="build"></span>
</div>

    },

    upcoming(body) {
      const L = D.live, made = L.updated_at ? new Date(L.updated_at) : null;
      const hours = made ? (Date.now() - made) / 36e5 : null;
      const ago = hours == null ? "unknown" : hours < 1 ? `${Math.max(1, Math.round(hours * 60))} min ago` : hours < 48 ? `${Math.round(hours)} h ago` : `${Math.round(hours / 24)} days ago`;
      const col = (ab) => { const t = TEAMS.find((x) => x[0] === ab); return t ? t[2][0] : "#888888"; };
      const dot = (ab) => `<i class="tdot" style="background:${col(ab)}"></i>`;
      const time = (iso) => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      const card = (g) => {
        const h = Math.round(100 * g.p_home), a = 100 - h;
        const chips = [g.lineup === "confirmed" ? `<span class="chip ok" data-tip="Both teams have posted their lineups, so the model uses the real lineup.">lineups posted</span>`
                                                : `<span class="chip" data-tip="Lineups usually post about an hour before puck drop. Until then the model assumes each team dresses the same players as last game.">expected lineups</span>`];
        if (g.away_b2b) chips.push(`<span class="chip" data-tip="${esc(g.away)} played yesterday too.">${esc(g.away)} on a back-to-back</span>`);
        if (g.home_b2b) chips.push(`<span class="chip" data-tip="${esc(g.home)} played yesterday too.">${esc(g.home)} on a back-to-back</span>`);
        const tipText = `${g.away} at ${g.home}\n${g.away} win chance ${a}%\n${g.home} win chance ${h}% (home)\novertime and shootouts included` +
          (g.why ? "\nclick to see why" : "");
        return (g.why ? `<a class="game" href="#/upcoming/${g.game_id}" data-tip="${esc(tipText)}">` : `<div class="game" tabindex="0" data-tip="${esc(tipText)}">`) +
          `<div class="when"><span>${esc(time(g.start_utc))}</span><span>away @ home</span></div>` +
          `<div class="teams-row"><span>${dot(g.away)}${esc(g.away)}</span><span class="at">@</span><span class="h">${esc(g.home)}${dot(g.home)}</span></div>` +
          `<div class="split" role="img" aria-label="${esc(`${g.away} ${a} percent, ${g.home} ${h} percent`)}"><span class="a" style="flex:${a}">${a}%</span><span class="h" style="flex:${h}">${h}%</span></div>` +
          `<div class="chips">${chips.join("")}</div>` + (g.why ? `<div class="more">WHY THIS PICK &gt;</div></a>` : `</div>`);
      };
      const rec = L.season_record, live = L.live_record, lab = L.label || "this season";
      const tiles = rec ? [["Picked the winner", pct(rec.accuracy), `${fmt(rec.n)} games played in ${lab}`],
                           ["Always picking the home team", pct(rec.home_rate), "the no-skill benchmark, same games"],
                           ["Prediction error", rec.log_loss.toFixed(3), "lower is better; a 50/50 guess scores 0.693"]] : [];
      if (live) tiles.push(["Logged before puck drop", pct(live.accuracy), `picked right in ${fmt(live.n)} games predicted live`]);
      body.innerHTML = `<p class="sub">Each team's next game, with the chance each side wins (overtime and shootouts included). ` +
        (L.upcoming.some((g) => g.why) ? `Open a game to see what drives its prediction. ` : "") +
        `Updated <b>${esc(ago)}</b>${hours != null && hours > 36 ? ", so these may be out of date" : ""}. Times are in your time zone.</p>` +
        `<div class="games">${L.upcoming.map(card).join("")}</div>` +
        `<div class="note" style="margin-bottom:16px">Analysis only, not betting advice. Even a 65% favorite loses about one game in three.</div>` +
        (rec ? `<h3>${esc(lab)} so far</h3><div class="tiles">${tiles.map(([k, v, s2]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s2)}</div></div>`).join("")}</div>` +
          `<div class="grid2"><div class="card"><h3>Latest results</h3><ul class="recent">${L.recent.map((r) => {
            const fav = r.p_home >= .5 ? r.home : r.away, pf = Math.round(100 * Math.max(r.p_home, 1 - r.p_home));
            const ok = (r.p_home >= .5) === (r.home_win === 1), won = r.home_win ? r.home : r.away;
            return `<li><span class="d">${esc(r.date.slice(5))}</span><span>${esc(r.away)} @ ${esc(r.home)}</span>` +
              `<span class="mono" data-tip="${esc(`we gave ${fav} ${pf}%; ${won} won`)}">${esc(fav)} ${pf}%</span><span class="${ok ? "right" : "wrong"}">${ok ? "right" : "wrong"}</span></li>`;
          }).join("")}</ul></div>` +
          `<div class="card"><h3>How these are graded</h3><ul class="plain">` +
          `<li>Season numbers re-create each game's prediction the way the backtests do: the model only knows games played before that month.</li>` +
          `<li>"Logged before puck drop" counts predictions this site actually published before each game. It starts small and grows every day.</li>` +
          `<li>Early in a season, a few dozen games can swing these numbers a lot. The long-run test is in the Model Scoreboard.</li></ul></div></div>` : "");
    },

    // one upcoming game: what pushes the model toward each side (see explain() in report/build.py)
    upcomingGame(body, id) {
      const g = D.live.upcoming.find((x) => String(x.game_id) === id);
      if (!g || !g.why) { location.hash = "#/upcoming"; return; }
      const W = g.why, H = g.home, A = g.away;
      const col = (ab) => { const t = TEAMS.find((x) => x[0] === ab); return t ? t[2][0] : "#888888"; };
      const dot = (ab) => `<i class="tdot" style="background:${col(ab)}"></i>`;
      const when = new Date(g.start_utc).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      const h = Math.round(100 * g.p_home), a = 100 - h, fav = h >= 50 ? H : A;
      const sgn = (v, d) => (v >= 0 ? "+" : "") + v.toFixed(d);
      const fv = (v, f) => v == null ? "-" : f === "pct" ? (100 * v).toFixed(1) + "%" : f === "pp" ? sgn(100 * v, 1) + " pts"
        : f === "int" ? String(Math.round(v)) : f === "yesno" ? (v ? "yes" : "no") : f === "signed2" ? sgn(v, 2)
        : f === "signed1" ? sgn(v, 1) : f === "num1" ? v.toFixed(1) : v.toFixed(2);
      const toward = (pts) => Math.abs(pts) < .05 ? `<span class="mono" style="color:var(--muted)">no pull</span>`
        : `<span class="mono ${pts > 0 ? "tow-h" : "tow-a"}">${Math.abs(pts).toFixed(1)} ${esc(pts > 0 ? H : A)}</span>`;
      const say = (pts) => Math.abs(pts) < .05 ? "no real pull either way" : `${Math.abs(pts).toFixed(1)} points toward ${pts > 0 ? H : A}`;
      const maxG = Math.max(2, ...W.groups.map((x) => Math.abs(x.pts)));
      const bar = (pts, max) => { const w = Math.min(50, 50 * Math.abs(pts) / max).toFixed(1);
        return `<span class="dtrack" aria-hidden="true"><i class="${pts >= 0 ? "h" : "a"}" style="width:${w}%"></i></span>`; };
      const axis = `<div class="drv axis-row" aria-hidden="true"><span class="lab"></span><span class="ends"><span class="tow-a">&lt; ${esc(A)}</span><span class="tow-h">${esc(H)} &gt;</span></span><span class="val"></span></div>`;
      const top = W.groups[0];
      body.innerHTML = `<p class="sub"><a href="#/upcoming" class="mono" style="color:var(--accent)">&lt; all games</a></p>` +
        `<div class="game" style="margin-bottom:14px"><div class="when"><span>${esc(when)}</span><span>away @ home</span></div>` +
        `<div class="teams-row"><span>${dot(A)}${esc(A)}</span><span class="at">@</span><span class="h">${esc(H)}${dot(H)}</span></div>` +
        `<div class="split" role="img" aria-label="${esc(`${A} ${a} percent, ${H} ${h} percent`)}"><span class="a" style="flex:${a}">${a}%</span><span class="h" style="flex:${h}">${h}%</span></div></div>` +
        `<p class="sub">If these two teams were even on every stat, home ice alone would give ${esc(H)} <b>${pct(W.base)}</b>. ` +
        `The stats move that to <b>${pct(g.p_home)}</b>, so the model leans ${esc(fav)}. ` +
        (top ? `The biggest factor is <b>${esc(top.name)}</b>: ${esc(say(top.pts))}.` : "") + `</p>` +
        `<div class="tiles">` + [
          [`${H} win chance`, pct(g.p_home, 0), `${A} ${pct(1 - g.p_home, 0)}`],
          ["Starting point", pct(W.base, 0), `${H} with home ice, teams even`],
          ["Biggest factor", top ? top.name : "-", top ? say(top.pts) : ""],
          ["Lineups", g.lineup === "confirmed" ? "posted" : "expected", g.lineup === "confirmed" ? "real lineups in the model" : "assumes last game's players"],
        ].map(([k, v, s2]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v" style="font-size:20px">${esc(v)}</div><div class="s">${esc(s2)}</div></div>`).join("") + `</div>` +
        `<div class="card" style="margin-bottom:14px"><h3>What moves the needle</h3>` +
        `<p class="note" style="margin:0 0 10px">Each bar: how much ${esc(H)}'s chance would change if the teams were even on that kind of stat, in percentage points.</p>` +
        axis + W.groups.map((x) => `<div class="drv" tabindex="0" data-tip="${esc(`${x.name}
${say(x.pts)}`)}"><span class="lab">${esc(x.name)}</span>${bar(x.pts, maxG)}<span class="val">${toward(x.pts)}</span></div>`).join("") +
        `</div><div class="card"><h3>Biggest single stats</h3><div class="tbl-wrap"><table class="data"><thead><tr><th>Stat</th><th>${esc(A)}</th><th>${esc(H)}</th><th>Pull</th></tr></thead><tbody>` +
        W.top.map((t) => `<tr><td class="stat">${esc(t.label)}<br><span class="note">${esc(t.group)}</span></td><td class="mono">${esc(fv(t.away, t.fmt))}</td><td class="mono">${esc(fv(t.home, t.fmt))}</td><td>${toward(t.pts)}</td></tr>`).join("") +
        `</tbody></table></div></div>` +
        `<div class="card" style="margin-top:14px"><h3>How to read this</h3><ul class="plain">` +
        `<li>The model compares the two teams on ${fmt(W.n_inputs)} stats (home minus away) and weighs each difference. These numbers come straight from that weighing for this game.</li>` +
        `<li>Many stats measure nearly the same thing (the same stat over 5, 10 or 20 games), so they share credit, and now and then two of them pull in opposite directions. The grouped bars are the steadier read.</li>` +
        `<li>Points don't add up exactly, because the same stat difference moves a 50/50 game more than a lopsided one.</li></ul></div>`;
    },

    games(body) {
      const P = D.predictions, R = P.rows;   // [date, season, away, home, p_home, home_win, score]
      const teams = [...new Set(R.flatMap((r) => [r[2], r[3]]))].sort();
      const seasons = [...new Set(R.map((r) => r[1]))].sort().reverse();
      let team = "", season = String(seasons[0]), outcome = "", page = 0;
      const PER = 40;
      const sl = (x) => `${String(x).slice(0, 4)}-${String(x).slice(6, 8)}`;
      body.innerHTML = `<p class="sub">Every game the model has been graded on: the test seasons, plus this season so far. ` +
        `Each chance was made using only games played before it. Pick a team or season to see how it did.</p>` +
        `<div class="filters"><select id="gx-season" aria-label="Season"><option value="">all seasons</option>${seasons.map((x) => `<option value="${x}">${sl(x)}</option>`).join("")}</select>` +
        `<select id="gx-team" aria-label="Team"><option value="">all teams</option>${teams.map((t) => `<option>${esc(t)}</option>`).join("")}</select>` +
        `<select id="gx-out" aria-label="Result"><option value="">all results</option><option value="right">picked right</option><option value="wrong">picked wrong</option><option value="upset">upsets (under 35%)</option></select></div>` +
        `<div class="card"><div class="sub" id="gx-sum" style="margin-bottom:8px"></div><div class="tbl-wrap"><table class="data" id="gx"></table></div>` +
        `<div class="pager"><button class="btn" type="button" id="gx-prev">newer</button><span id="gx-page"></span><button class="btn" type="button" id="gx-next">older</button></div></div>`;
      $("gx-season").value = season;
      const filtered = () => R.filter((r) => (!season || String(r[1]) === season) && (!team || r[2] === team || r[3] === team) && (() => {
        const ok = (r[4] >= .5) === (r[5] === 1), winP = r[5] ? r[4] : 1 - r[4];
        return !outcome || (outcome === "right" ? ok : outcome === "wrong" ? !ok : winP < .35);
      })()).reverse();
      const draw = () => {
        const F = filtered(), pages = Math.max(1, Math.ceil(F.length / PER)); page = Math.min(page, pages - 1);
        const right = F.filter((r) => (r[4] >= .5) === (r[5] === 1)).length;
        const ll = F.length ? F.reduce((a, r) => a - Math.log(Math.min(1 - 1e-15, Math.max(1e-15, r[5] ? r[4] : 1 - r[4]))), 0) / F.length : null;
        $("gx-sum").innerHTML = F.length ? `<b>${fmt(F.length)}</b> games: picked the winner in <b>${pct(right / F.length)}</b>, prediction error <b>${ll.toFixed(3)}</b> (a 50/50 guess scores 0.693).` : "No games match.";
        $("gx").innerHTML = `<thead><tr><th>Date</th><th style="text-align:left">Game</th><th>Final</th><th>Home win chance</th><th>Our pick</th><th>Result</th></tr></thead><tbody>` +
          F.slice(page * PER, page * PER + PER).map((r) => {
            const fav = r[4] >= .5 ? r[3] : r[2], ok = (r[4] >= .5) === (r[5] === 1);
            return `<tr><td>${esc(r[0])}</td><td style="text-align:left">${esc(r[2])} @ ${esc(r[3])}</td><td class="mono">${esc(r[6])}</td><td>${(100 * r[4]).toFixed(0)}%</td>` +
              `<td>${esc(fav)} ${(100 * Math.max(r[4], 1 - r[4])).toFixed(0)}%</td><td class="${ok ? "right" : "wrong"}">${ok ? "right" : "wrong"}</td></tr>`;
          }).join("") + `</tbody>`;
        $("gx-page").textContent = `page ${page + 1} of ${pages}`;
        $("gx-prev").disabled = page === 0; $("gx-next").disabled = page >= pages - 1;
      };
      $("gx-season").addEventListener("change", (e) => { season = e.target.value; page = 0; draw(); });
      $("gx-team").addEventListener("change", (e) => { team = e.target.value; page = 0; draw(); });
      $("gx-out").addEventListener("change", (e) => { outcome = e.target.value; page = 0; draw(); });
      $("gx-prev").addEventListener("click", () => { page--; draw(); });
      $("gx-next").addEventListener("click", () => { page++; draw(); });
      draw();
    },

    paper(body) {
      const P = D.paper, S2 = P.summary, R = P.rules;
      const ml = (v) => (v > 0 ? "+" : "") + v;
      const signed = (v, d = 2) => (v == null ? "-" : (v > 0 ? "+" : "") + v.toFixed(d));
      const pts = (v) => { if (v == null) return "-"; const r = Math.round(1000 * v) / 10; return (r > 0 ? "+" : "") + (r || 0).toFixed(1) + " pts"; };
      const tiles = [
        ["Bankroll", S2.bankroll.toFixed(2) + "u", `started at ${S2.bankroll_start}u on ${P.since}`],
        ["Flat 1-unit benchmark", S2.flat.bankroll.toFixed(2) + "u", `same bets, ${R.flat_stake}u each: ${S2.flat.roi == null ? "-" : pct(S2.flat.roi)} return`],
        ["Record", `${S2.won}-${S2.lost}`, `${S2.settled} settled, ${S2.open} waiting; parlays ${S2.parlays_won}-${S2.parlays_settled - S2.parlays_won}`],
        ["Return on stakes", S2.roi == null ? "-" : pct(S2.roi), `${signed(S2.profit)}u on ${S2.staked}u staked`],
        ["Beat the closing price", S2.beat_close == null ? "-" : pct(S2.beat_close, 0), `average move ${pts(S2.avg_clv)} our way`],
      ];
      const c = S2.curve, cf = S2.curve_flat, W = 600, H = 120;
      let chart = `<div class="note">The bankroll chart starts once the first bet is settled.</div>`;
      if (c.length) {
        const ys = [S2.bankroll_start, ...c], yf = [S2.bankroll_start, ...cf], all = ys.concat(yf);
        const lo = Math.min(...all), hi = Math.max(...all), span = Math.max(hi - lo, 1);
        const y = (v) => (H - 8 - ((v - lo) / span) * (H - 16)).toFixed(1), x = (i) => ((i / Math.max(ys.length - 1, 1)) * W).toFixed(1);
        chart = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" role="img" aria-label="Bankroll after each settled bet">` +
          `<line x1="0" x2="${W}" y1="${y(S2.bankroll_start)}" y2="${y(S2.bankroll_start)}" stroke="var(--line)" stroke-dasharray="4 4"/>` +
          `<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 3" vector-effect="non-scaling-stroke" points="${yf.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>` +
          `<polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${ys.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/></svg>` +
          `<div class="legend"><span><span class="sw" style="--c:var(--accent)">#</span>our staking (bigger bets on bigger edges, plus parlays)</span>` +
          `<span><span class="sw" style="--c:var(--muted)">:</span>flat ${R.flat_stake}u on every bet</span></div>` +
          `<div class="note">Bankroll after each settled bet, in units. Dashed line: the starting ${S2.bankroll_start}u.</div>`;
      }
      const tiers = R.stake_tiers.map(([e, u], i) => { const nx = R.stake_tiers[i + 1];
        return `${u}u at ${(100 * e).toFixed(0)}${nx ? `-${(100 * nx[0]).toFixed(0)}` : "+"} points`; }).join(", ");
      const day = (iso) => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
      const RES = { won: ["won", "right"], lost: ["lost", "wrong"], open: ["not started", ""], pending: ["waiting", ""] };
      body.innerHTML = `<p class="sub">Pretend bets, no real money. Before each game the model's win chance is compared with the betting price ` +
        `from the NHL's betting partner (${esc(P.books.join(", ") || "none yet")}), with the bookmaker's cut taken out. When our chance for a team is at least ` +
        `${(100 * R.min_edge).toFixed(0)} points higher, we bet on that team at that price; anything closer is a toss-up and we sit it out. ` +
        `The bigger the gap, the bigger the bet: ${tiers}. When ${(100 * R.parlay.min_edge).toFixed(0)}+ point picks line up on the same day, ` +
        `the strongest ${R.parlay.max_legs > 2 ? `two or three` : "two"} also go into a ${R.parlay.stake}u parlay. Each bet is the last one made before puck drop, so it uses the confirmed lineup when it posts in time; ` +
        `a parlay is locked when its first game starts.</p>` +
        `<div class="tiles">${tiles.map(([k, v, s]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join("")}</div>` +
        `<div class="card" style="margin-bottom:14px">${chart}</div>` +
        `<div class="card" style="margin-bottom:14px"><dl class="gloss">` +
        `<dt>Edge</dt><dd>Our win chance minus the book's, after removing the bookmaker's cut. ${S2.bets} bets out of ${S2.games_priced} priced games so far, average edge ${pts(S2.avg_edge)}.</dd>` +
        `<dt>Closing price</dt><dd>The last price before puck drop. If the market moved toward our side after we bet, we beat the close. Over a few hundred bets this says more than the win-loss record, which is mostly luck early on.</dd>` +
        `<dt>Unit</dt><dd>A fixed bet size. Profit is shown in units, so it reads the same whatever one unit is worth.</dd>` +
        `<dt>Parlay</dt><dd>One bet on several games that pays only if every pick wins. The payout multiplies, but so does the bookmaker's cut, so it is kept small.</dd></dl></div>` +
        `<div class="card tbl-wrap"><table class="data"><thead><tr><th>Date</th><th style="text-align:left">Game</th><th>Bet</th><th>Price</th><th>Our chance</th>` +
        `<th>Book's chance</th><th>Stake</th><th>Close</th><th>Moved</th><th>Result</th><th>Profit</th></tr></thead><tbody>${
          P.bets.map((b) => { const r = RES[b.status] || [b.status, ""];
            return `<tr><td>${esc(day(b.start_utc))}</td><td style="text-align:left">${esc(b.away)} @ ${esc(b.home)}</td><td>${esc(b.team)}</td>` +
              `<td class="mono">${esc(ml(b.price))}</td><td>${pct(b.p)}</td><td>${pct(b.p_mkt)}</td><td class="mono">${b.stake}u</td><td class="mono">${b.close == null ? "-" : esc(ml(b.close))}</td>` +
              `<td>${b.clv == null ? "-" : esc(pts(b.clv))}</td><td class="${r[1]}">${esc(r[0])}</td><td class="mono">${b.profit == null ? "-" : esc(signed(b.profit))}</td></tr>`; }).join("")
        }</tbody></table>${P.bets.length ? "" : `<div class="note">No game has cleared the ${(100 * R.min_edge).toFixed(0)}-point bar yet.</div>`}</div>` +
        `<div class="card tbl-wrap" style="margin-top:14px"><h3>Parlays</h3>${P.parlays.length ? `<table class="data"><thead><tr><th>Date</th><th style="text-align:left">Picks</th>` +
          `<th>Pays</th><th>Our chance</th><th>Book's chance</th><th>Stake</th><th>Result</th><th>Profit</th></tr></thead><tbody>${
          P.parlays.map((q) => { const r = RES[q.status] || [q.status, ""];
            return `<tr><td>${esc(q.date)}</td><td style="text-align:left" class="mono">${esc(q.legs)}</td><td class="mono">${q.decimal.toFixed(2)}x</td>` +
              `<td>${pct(q.p)}</td><td>${pct(q.p_mkt)}</td><td class="mono">${q.stake}u</td><td class="${r[1]}">${esc(r[0])}</td>` +
              `<td class="mono">${q.profit == null ? "-" : esc(signed(q.profit))}</td></tr>`; }).join("")}</tbody></table>`
          : `<div class="note">No day has had two ${(100 * R.parlay.min_edge).toFixed(0)}+ point picks yet.</div>`}</div>` +
        `<div class="note">For tracking the model only. Nothing here is betting advice.</div>`;
    },

    settings(body) {
      const dots = (cols) => `<span class="dots" aria-hidden="true">${cols.slice(0, 2).map((c) => `<i style="background:${c}"></i>`).join("")}</span>`;
      body.innerHTML = `<div class="card">
        <div class="opt"><div style="width:100%"><div>Team colors</div><div class="d">Recolor the site in your team's colors. Charts keep their own colors so they stay easy to read.</div>
          <div class="teams" id="teams"><button type="button" data-v="" data-tip="The house colors">${dots(["#2a9fd0", "#8a72ea"])}default</button>${
          TEAMS.map(([ab, name, cols]) => `<button type="button" data-v="${ab}" data-tip="${esc(name)}" aria-label="${esc(name)}">${dots(cols)}${ab}</button>`).join("")}</div>
          <div class="note">Colors are for decoration only. This project isn't affiliated with the NHL or any team.</div></div></div>
        <div class="opt"><div><div>Light or dark</div><div class="d">Works with any team's colors.</div></div>
          <div class="seg" id="seg-theme"><button type="button" data-v="dark">dark</button><button type="button" data-v="light">light</button></div></div>
        <div class="opt"><div><div>Effects</div><div class="d">${osReduced ? "Off: your device asks for reduced motion." : "Animated background and text effects."}</div></div>
          <div class="seg" id="seg-fx"><button type="button" data-v="on">on</button><button type="button" data-v="off">off</button></div></div></div>`;
      const sync = () => {
        $("teams").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === team)));
        $("seg-theme").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === theme)));
        $("seg-fx").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === (calm ? "off" : "on"))));
      };
      $("teams").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; team = b.dataset.v; store.set("suede.team", team); applyTheme(); sync();
        toast(team ? `${TEAMS.find((x) => x[0] === team)[1].toUpperCase()} COLORS` : "HOUSE COLORS"); });
      $("seg-theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; theme = b.dataset.v; store.set("suede.theme", theme); applyTheme(); sync(); });
      $("seg-fx").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b || osReduced) return;
        calm = b.dataset.v === "off"; store.set("suede.fx", calm ? "off" : "on"); applyCalm(); sync(); });
      sync();
    },
  };
  function renderLocked(body, a) {
    body.innerHTML = `<div class="locked-box"><pre aria-hidden="true">${esc(lockArt)}</pre><div><h3>${esc(a.label)} isn't ready yet</h3>` +
      `<p>It opens once the project has ${esc(a.need)}</p><p>We don't show made-up numbers, so this area stays locked until the real results exist.</p>` +
      `<span class="chip lock">LOCKED</span></div></div>`;
  }

  function renderPanel(a, sub) {
    show("panel");
    $("p-idx").textContent = String(AREAS.indexOf(a) + 1).padStart(2, "0");
    $("p-title").textContent = a.label;
    const body = $("p-body"); body.scrollTop = 0;
    if (!a.unlocked) renderLocked(body, a); else if (sub && RENDER[a.id + "Game"]) RENDER[a.id + "Game"](body, sub); else RENDER[a.id](body);
    reveal();
    $("back").focus({ preventScroll: true });
  }

  // ---------- tooltip (hover + focus) ----------
  const tip = $("tip");
  function showTip(text, x, y) { tip.textContent = text; tip.classList.add("on"); const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - r.width - 8)) + "px"; tip.style.top = Math.max(8, Math.min(y + 16, innerHeight - r.height - 8)) + "px"; }
  document.addEventListener("pointermove", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else tip.classList.remove("on"); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el.dataset.tip, r.left, r.bottom); } });
  document.addEventListener("focusout", () => tip.classList.remove("on"));

  route();
})();
</script>
</body>
</html>
