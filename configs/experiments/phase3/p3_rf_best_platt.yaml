id: p3_rf_best_platt
notes: 'Phase 3 calibration round on dev: best uncalibrated rf + platt fit on the
  1,500 most recent games before each refit.'
model:
  type: rf
  params:
    n_estimators: 500
    min_samples_leaf: 200
    max_features: sqrt
  calibration: platt
  calib_games: 1500
  features: full
