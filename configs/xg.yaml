processed_dir: data/processed
# Seasons used to train season S's model: all earlier seasons (null) or the last N.
train_window_seasons: 5   # chosen on dev seasons 2013-14..2018-19 (ties "all" on log loss, lower ECE); see results/xg_eval_*.csv
lgb_params:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  random_state: 20251018
  deterministic: true
  force_row_wise: true
  verbose: -1
