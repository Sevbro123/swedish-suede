# Team-strength and situational feature config. Window choice is an experimental variable:
# experiments override `windows` to compare 5 / 10 / 20 games, season-to-date and EWM.

# Stat pairs turned into shares F / (F + A); per-game for/against rates are emitted too.
share_stats: [goals, sog, fenwick, corsi, goals_5v5, fenwick_5v5, corsi_5v5, xg, xg_5v5,
              corsi_5v5_sa, fenwick_5v5_sa, xg_5v5_sa, corsi_5v5_sva, fenwick_5v5_sva, xg_5v5_sva]
rate_stats: [goals, sog, pp_goals, sh_goals, penalties]
# [numerator, seconds] pairs emitted per 60 minutes: power play (own PP goals per PP minute) and
# penalty kill (goals allowed while shorthanded per PK minute).
per60_stats: [[pp_goals_for, toi_pp_s], [pp_goals_against, toi_pk_s]]

# Player 5v5 on-ice xG metrics and lineup features (features/players.py). Fixed in advance, not tuned.
# The Phase 3 "full" matrix leaves lineup columns out unless a config asks for them.
players:
  halflife_games: 40         # player on/off-ice xG sums, decayed across seasons and teams
  pseudo_xg: 10              # on-ice share shrinkage: about 300 5v5 minutes of league-average play
  toi_halflife_games: 10     # expected 5v5 TOI per game (lineup weights)
  default_toi_s: 600         # expected 5v5 TOI for a player with no history
  regular_window: 10         # "regular" = dressed in at least regular_min of the previous 10 games
  regular_min: 5

# Score and venue adjustment of 5v5 corsi / fenwick / xG (features/adjust.py): _sa_ = score-adjusted,
# _sva_ = score- and venue-adjusted. Coefficients come only from earlier seasons. Fixed in advance,
# not tuned. The Phase 3 "full" matrix leaves these columns out unless a config asks for them.
adjust:
  score_cap: 2               # leads of 2+ pooled (and trailing by 2+)
  score_seasons: 3           # score weights from the 3 previous seasons
  venue_seasons: 2           # venue factors from the 2 previous seasons (~82 home games)
  venue_pseudo_games: 40     # shrinkage toward 1: n_home / (n_home + 40)

windows:
  last_n: [5, 10, 20]        # last N games of this franchise; may span seasons (see cross_season)
  cross_season: true         # last-N windows reach into the previous season early on
  season_to_date: true       # resets each season; shrunk toward a prior (below)
  ewm_halflife_games: [5, 15] # exponentially weighted, spans seasons

shrinkage:
  # Season-to-date stats are blended with k pseudo-games at the prior per-game rate.
  # Prior = previous-season per-game rate regressed toward the league mean by `regress`
  # (0 = ignore last season, 1 = trust it fully). Teams with no previous season (first
  # season of the data, expansion teams) use the league mean as of the game.
  pseudo_games: 10
  regress_to_prior: 0.6

situational:
  rest_days_cap: 10
  recent_days: 7

# Franchise lineage: team ids that continue an earlier franchise (relocation / rename),
# so windows and priors carry across the change. Values verified from the games table.
lineage:
  52: 11   # Winnipeg Jets (2011-) <- Atlanta Thrashers
  53: 27   # Arizona Coyotes (2014-) <- Phoenix Coyotes
  59: 53   # Utah Hockey Club (2024-) <- Arizona Coyotes (hockey operations transferred)
  68: 59   # Utah Mammoth (2025-) <- Utah Hockey Club

goalies:
  # GSAx per 100 shots is shrunk toward 0 (league average) with this many pseudo-shots.
  # Single-season goalie GSAx is very noisy, so the prior is deliberately strong. Tunable.
  prior_shots: 800
  ewm_halflife_games: 20
  candidate_pool_games: 20   # candidates = goalies who started any of the previous N team games
  seed: 0
  # GSAx relative to the league-average GSAx/shot from strictly earlier games this season (xG drifts
  # between seasons). The running rate is blended with this many pseudo-shots at last season's rate.
  league_relative: true
  league_prior_shots: 5000   # chosen on the feature's own league-wide bias (no game outcomes used)

# Player RAPM on 5v5 xG (ratings/rapm.py), refit monthly; summed over the lineup in features/players.py.
# lam (ridge penalty, in 5v5 minutes) and halflife_months (decay of older stints) were chosen on the
# development seasons: see docs/player_ratings_choices.md.
rapm:
  lam: 300
  halflife_months: 24

# Recent form (features/form.py): lineup skaters' points / goals / own-shot xG per game over their last N games
# minus their own long-run rate, the expected starter's GSAx/100 over his last N appearances minus his career
# rate, and the team's recent win rate and streak. The full matrix leaves form_* out unless a config sets
# ``features: full_rapm_form``.
form:
  windows: [5, 10, 20]            # skater and team windows, in games
  goalie_windows: [3, 5, 10]      # goalie appearances
  baseline_halflife_games: 82     # a skater's norm: decayed per-game rate, about one season's half-life
  baseline_pseudo_games: 20       # ... shrunk toward the league rate for his position (F / D)
  goalie_recent_pseudo_shots: 100 # recent GSAx/100 shrunk toward 0 (about 4 starts of shots)

# Elo results rating (features/elo.py): wins and goal margins of earlier games. Fixed in advance, not tuned.
# The full matrix leaves elo_* out unless a config sets ``features: full_rapm_elo``.
elo:
  k: 6                 # rating points per unit of ln(|goal margin| + 1)
  hfa: 35              # home edge in the expected result, in Elo points (none at neutral sites)
  carry: 0.7           # share of a rating's distance from 1500 kept into the next season
