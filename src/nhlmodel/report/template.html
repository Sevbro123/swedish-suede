<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swedish suede</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1424'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%232a9fd0' font-family='monospace'%3E%23%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: dark is the default look; light is opt-in from Settings ----------
     Series colors were validated per mode with the dataviz palette checker. */
  :root {
    color-scheme: dark;
    --bg: #0d1424; --card: #121b30; --card-2: #0f1729; --line: #22304d; --ink: #e6eefc; --ink-2: #a9b8d3; --muted: #8394b3;
    --s1: #2a9fd0; --s2: #8a72ea; --s3: #1fa57c;
    --accent: #2a9fd0; --accent-2: #8a72ea; --glow: rgba(42,159,208,.18);
    --field-a: 42,159,208; --field-b: 138,114,234; --field-alpha: .7;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f9fc; --card: #ffffff; --card-2: #f2f5fa; --line: #dde3ee; --ink: #0e1a2b; --ink-2: #46566f; --muted: #5d6d86;
    --s1: #1f6fd1; --s2: #b0389f; --s3: #0a8462;
    --accent: #1f6fd1; --accent-2: #b0389f; --glow: rgba(31,111,209,.12);
    --field-a: 31,111,209; --field-b: 176,56,159; --field-alpha: .45;
    --shadow: 0 1px 2px rgba(14,26,43,.06), 0 18px 40px rgba(14,26,43,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif; overflow: hidden; }
  .mono, pre, button.mi, .chip, .hud, .bar-fill { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  [hidden] { display: none !important; }

  #field { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: background .5s;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--bg) 35%, transparent), color-mix(in srgb, var(--bg) 70%, transparent)); }
  body[data-view="panel"] .veil { background: color-mix(in srgb, var(--bg) 78%, transparent); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; gap: 12px;
    padding: 12px 16px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .hud.top { top: 0; } .hud.bottom { bottom: 0; }
  .hud b { color: var(--accent); font-weight: 600; }
  .hud .brand { color: var(--ink); font-weight: 600; letter-spacing: .04em; }
  @media (max-width: 560px) { .hud .wide { display: none; } }

  #stage { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 48px 16px; }

  /* ---------- title screen ---------- */
  #title { text-align: center; }
  #logo { margin: 0 auto; font-weight: 800; line-height: 1.05; font-size: clamp(5px, 1.45vw, 15px);
    background: linear-gradient(90deg, var(--s1), var(--s2) 60%, var(--s3)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px var(--glow)); white-space: pre; display: inline-block; text-align: left; }
  @media (max-width: 700px) { #logo { font-size: clamp(6px, 2.9vw, 15px); } }
  #start { display: block; margin: 40px auto 0; font: 600 15px "JetBrains Mono", monospace; letter-spacing: .3em; color: var(--ink); background: none; border: 1px solid var(--line);
    padding: 12px 22px; border-radius: 10px; cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  #start:hover { border-color: var(--accent); background: var(--glow); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---------- main menu ---------- */
  #menu { width: min(560px, 100%); }
  .menu-head { font: 12px "JetBrains Mono", monospace; letter-spacing: .25em; color: var(--muted); margin: 0 0 10px 6px; }
  .menu-head b { color: var(--accent); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  button.mi { width: 100%; display: grid; grid-template-columns: 2ch 1fr auto; gap: 10px; align-items: center; text-align: left;
    background: none; border: 0; color: var(--ink-2); padding: 11px 12px; border-radius: 10px; cursor: pointer; font-size: 17px;
    transition: background .18s, color .18s, transform .18s; }
  button.mi .cur { color: var(--accent); opacity: 0; transition: opacity .15s; }
  button.mi[aria-current="true"] { color: var(--ink); background: color-mix(in srgb, var(--card) 80%, transparent); transform: translateX(6px);
    box-shadow: inset 0 0 0 1px var(--line); }
  button.mi[aria-current="true"] .cur { opacity: 1; }
  button.mi .lbl { letter-spacing: .08em; }
  button.mi .desc { display: block; font: 13px "Space Grotesk", sans-serif; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  button.mi.locked .lbl { color: var(--muted); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .chip.new { color: var(--s3); border-color: color-mix(in srgb, var(--s3) 55%, transparent); }
  .chip.lock { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); }
  .keys { margin: 16px 6px 0; font-size: 12px; color: var(--muted); }
  .keys kbd { font: 11px "JetBrains Mono", monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

  /* ---------- panel ---------- */
  #panel { position: relative; width: min(1000px, 100%); max-height: calc(100vh - 96px); display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  #panel::before, #panel::after { content: "+"; position: absolute; font: 14px "JetBrains Mono", monospace; color: var(--accent); z-index: 3; }
  #panel::before { top: 4px; left: 8px; } #panel::after { bottom: 4px; right: 8px; }
  .p-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; border-bottom: 1px dashed var(--line); }
  #back { font: 13px "JetBrains Mono", monospace; color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #back:hover { color: var(--ink); border-color: var(--accent); }
  .p-head h2 { margin: 0; font: 700 22px "Space Grotesk", sans-serif; letter-spacing: -.01em; }
  .p-head .idx { font: 13px "JetBrains Mono", monospace; color: var(--accent); }
  .p-body { position: relative; padding: 18px 20px 22px; overflow: auto; }
  #noise { position: absolute; inset: 0; margin: 0; z-index: 2; pointer-events: none; color: var(--accent); font-size: 13px; line-height: 1.15;
    overflow: hidden; background: color-mix(in srgb, var(--card) 92%, transparent); }
  .sub { color: var(--ink-2); margin: 0 0 16px; max-width: 72ch; }
  .card { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 > * { min-width: 0; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  h3 { margin: 0 0 10px; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); } .tile .v { font: 600 24px "JetBrains Mono", monospace; } .tile .s { font-size: 12px; color: var(--ink-2); }
  .prog { font: 13px "JetBrains Mono", monospace; color: var(--ink-2); overflow: hidden; white-space: nowrap; }
  .prog .tr { color: color-mix(in srgb, var(--ink) 25%, transparent); } .prog .fl { color: var(--accent); }
  .prog-head { display: flex; justify-content: space-between; font-size: 14px; }
  ol.phases { list-style: none; margin: 0; padding: 0; }
  ol.phases li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 15px; }
  ol.phases li:last-child { border-bottom: 0; }
  .ph-ico { font: 14px "JetBrains Mono", monospace; color: var(--muted); } .ph-ico.done { color: var(--s3); } .ph-ico.wip { color: var(--accent); }

  /* table */
  .tbl-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { font-weight: 500; color: var(--ink-2); }
  table.data th button { all: unset; cursor: pointer; }
  table.data th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table.data th[aria-sort] button::after { content: " ."; color: var(--muted); font-family: "JetBrains Mono", monospace; }
  table.data th[aria-sort="ascending"] button::after { content: " ^"; color: var(--accent); }
  table.data th[aria-sort="descending"] button::after { content: " v"; color: var(--accent); }
  table.data tbody tr:hover { background: var(--glow); }
  td .mini { font: 12px "JetBrains Mono", monospace; color: var(--accent); letter-spacing: 1px; margin-right: 8px; }
  td.pending { color: var(--muted); } .flag { color: var(--accent-2); font-weight: 600; }

  /* ascii bars */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 6px; font-size: 14px; color: var(--ink-2); }
  .legend .sw { display: inline-grid; place-items: center; width: 22px; height: 16px; border-radius: 4px; margin-right: 6px; vertical-align: -3px;
    background: var(--c); color: var(--bg); font: 600 11px "JetBrains Mono", monospace; }
  .season-group { padding: 10px 0; border-top: 1px dashed var(--line); } .season-group:first-of-type { border-top: 0; }
  .season-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 0 6px 6px; }
  .season-head span { font-size: 13px; color: var(--muted); }
  .bar-row { display: grid; grid-template-columns: 128px 1fr 64px; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 8px; }
  .bar-row:hover, .bar-row:focus-visible { background: var(--glow); }
  .bar-row .lab { font-size: 14px; color: var(--ink-2); } .bar-row .val { font: 14px "JetBrains Mono", monospace; text-align: right; }
  @media (max-width: 520px) { .bar-row { grid-template-columns: 1fr 58px; } .bar-row .lab { grid-column: 1 / -1; } }
  .bar-track { position: relative; height: 22px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 6%, transparent); overflow: hidden; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 0 6px 6px 0; overflow: hidden; white-space: nowrap; font-size: 13px;
    line-height: 22px; letter-spacing: 1px; color: var(--bg); background: var(--c); transition: width 900ms cubic-bezier(.2,.8,.2,1); }
  .bar-fill::before { content: attr(data-tex); opacity: .5; padding-left: 3px; }

  /* locked + settings */
  .locked-box { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; padding: 10px 4px; }
  .locked-box pre { margin: 0; font-size: 14px; line-height: 1.1; color: var(--accent-2); }
  .locked-box h3 { font-size: 20px; margin: 0 0 6px; } .locked-box p { margin: 0 0 8px; color: var(--ink-2); }
  @media (max-width: 560px) { .locked-box { grid-template-columns: 1fr; } }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: 0; }
  .opt .d { color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { font: 13px "JetBrains Mono", monospace; background: none; border: 0; color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--glow); color: var(--ink); }
  .btn { font: 13px "JetBrains Mono", monospace; background: none; border: 1px solid var(--line); color: var(--ink-2); padding: 6px 12px; border-radius: 9px; cursor: pointer; }

  /* toast + tooltip */
  #toast { position: fixed; z-index: 8; left: 50%; top: 52px; transform: translate(-50%, -12px); opacity: 0; transition: opacity .25s, transform .25s;
    font: 12px "JetBrains Mono", monospace; letter-spacing: .18em; color: var(--s3); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 16px; box-shadow: var(--shadow); pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #tip { position: fixed; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .12s; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 13px; max-width: 280px; white-space: pre-line; }
  #tip.on { opacity: 1; }

  body.calm #start { animation: none; }
  body.calm .bar-fill { transition: none; }
</style>
</head>
<body data-view="title">
<canvas id="field" aria-hidden="true"></canvas>
<div class="veil"></div>

<div class="hud top">
  <span class="brand">[#] swedish suede</span>
  <span>AREAS <b id="found">0</b>/<span id="areas">0</span><span class="wide"> &nbsp;|&nbsp; rev <span id="rev"></span></span></span>
</div>

<main id="stage">
  <section id="title" aria-label="Title screen">
    <pre id="logo" aria-label="swedish suede"></pre>
    <button id="start" type="button">PRESS START</button>
  </section>

  <nav id="menu" aria-label="Main menu" hidden>
    <div class="menu-head">MAIN MENU &middot; <b id="menu-count"></b></div>
    <ul class="items" id="items" role="list"></ul>
    <div class="keys"><kbd>up</kbd> <kbd>down</kbd> move &nbsp; <kbd>enter</kbd> open &nbsp; <kbd>esc</kbd> back</div>
  </nav>

  <section id="panel" aria-labelledby="p-title" hidden>
    <div class="p-head">
      <button id="back" type="button">&lt; back</button>
      <span class="idx" id="p-idx"></span>
      <h2 id="p-title"></h2>
    </div>
    <div class="p-body" id="p-body"></div>
  </section>
</main>

<div class="hud bottom">
  <span>analysis only &middot; no wagering module installed</span>
  <span class="wide" id="build"></span>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("payload").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* unavailable */ } },
  };
  const osReduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let calm = osReduced || store.get("suede.fx") === "off";
  const pct = (x, d = 1) => (x == null ? "-" : (100 * x).toFixed(d) + "%");
  const fmt = (n) => Number(n).toLocaleString();
  const GLYPHS = "#%&*+=-:.<>/\\|[]{}";
  const rnd = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  const S = D.data.seasons, total = D.data.total_games;
  const processed = S.filter((s) => s.processed);
  const pbp = S.reduce((a, s) => a + Math.min(s.pbp_downloaded, s.games), 0);
  const sh = S.reduce((a, s) => a + Math.min(s.shifts_downloaded, s.games), 0);

  // ---------- theme / effects ----------
  let theme = store.get("suede.theme") === "light" ? "light" : "dark";
  function applyTheme() { if (theme === "light") document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme; field.recolor(); }
  function applyCalm() { document.body.classList.toggle("calm", calm); field.setCalm(calm); }

  // ---------- reactive ascii field ----------
  const field = (() => {
    const cv = $("field"), ctx = cv.getContext("2d"), RAMP = " .:-=+*#%@";
    let W = 0, H = 0, cols = 0, rows = 0, cell = 14, t = 0, raf = 0, last = 0, still = calm;
    let colA = [42, 159, 208], colB = [138, 114, 234], alpha = .7, dim = 1, dimTarget = 1;
    const mouse = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4 }, ripples = [];
    function readColors() {
      const cs = getComputedStyle(document.documentElement);
      colA = cs.getPropertyValue("--field-a").split(",").map(Number); colB = cs.getPropertyValue("--field-b").split(",").map(Number);
      alpha = parseFloat(cs.getPropertyValue("--field-alpha")) || .6;
    }
    function resize() {
      const dpr = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
      cell = W < 600 ? 12 : 14; cols = Math.ceil(W / (cell * .62)); rows = Math.ceil(H / cell);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.font = `${cell}px "JetBrains Mono", ui-monospace, monospace`; ctx.textBaseline = "top";
    }
    function draw(now) {
      raf = 0;
      if (!still && now - last < 33) return schedule();
      last = now; if (!still) t += .016;
      mouse.x += (mouse.tx - mouse.x) * .12; mouse.y += (mouse.ty - mouse.y) * .12; dim += (dimTarget - dim) * .08;
      ctx.clearRect(0, 0, W, H);
      const cw = cell * .62;
      for (let j = 0; j < rows; j++) {
        const y = j * cell;
        for (let i = 0; i < cols; i++) {
          const x = i * cw;
          let v = Math.sin(i * .11 + t * .9) + Math.sin(j * .17 - t * .7) + Math.sin((i + j) * .07 + t * .5)
                + Math.sin(Math.hypot(i - cols * .7, j - rows * .4) * .16 - t * 1.3);
          v = (v + 4) / 8 + Math.max(0, 1 - Math.hypot(x - mouse.x, y - mouse.y) / 170) * .55;
          for (const r of ripples) v += Math.max(0, 1 - Math.abs(Math.hypot(x - r.x, y - r.y) - r.r) / 28) * r.a * .8;
          v = Math.max(0, Math.min(.999, v));
          const ch = RAMP[Math.floor(v * RAMP.length)];
          if (ch === " ") continue;
          const m = i / cols;
          ctx.fillStyle = `rgba(${Math.round(colA[0] * (1 - m) + colB[0] * m)},${Math.round(colA[1] * (1 - m) + colB[1] * m)},${
            Math.round(colA[2] * (1 - m) + colB[2] * m)},${(alpha * dim * (.22 + v * .78)).toFixed(3)})`;
          ctx.fillText(ch, x, y);
        }
      }
      for (let k = ripples.length - 1; k >= 0; k--) { const r = ripples[k]; r.r += 7; r.a *= .965; if (r.a < .03) ripples.splice(k, 1); }
      if (!still) schedule();
    }
    function schedule() { if (!raf && !document.hidden) raf = requestAnimationFrame(draw); }
    addEventListener("pointermove", (e) => { mouse.tx = e.clientX; mouse.ty = e.clientY; });
    document.addEventListener("pointerleave", () => { mouse.tx = mouse.ty = -1e4; });
    addEventListener("pointerdown", (e) => { if (!still) ripples.push({ x: e.clientX, y: e.clientY, r: 0, a: 1 }); });
    document.addEventListener("visibilitychange", schedule);
    addEventListener("resize", () => { resize(); if (still) draw(performance.now()); });
    readColors(); resize();
    if (document.fonts) document.fonts.ready.then(() => { resize(); if (still) draw(performance.now()); });
    if (still) draw(performance.now()); else schedule();
    return {
      recolor() { readColors(); if (still) draw(performance.now()); },
      setDim(d) { dimTarget = d; if (still) { dim = d; draw(performance.now()); } },
      setCalm(c) { still = c; if (c) draw(performance.now()); else schedule(); },
      burst(x, y) { if (!still) ripples.push({ x, y, r: 0, a: 1.2 }); },
    };
  })();
  applyTheme(); applyCalm();

  // ---------- logo: figlet-style letters, assembled from noise ----------
  const L = {
    S: [" ____  ", "/ ___| ", "\\___ \\ ", " ___) |", "|____/ "],
    W: ["__        __", "\\ \\      / /", " \\ \\ /\\ / / ", "  \\ V  V /  ", "   \\_/\\_/   "],
    E: [" _____ ", "| ____|", "|  _|  ", "| |___ ", "|_____|"],
    D: [" ____  ", "|  _ \\ ", "| | | |", "| |_| |", "|____/ "],
    I: [" ___ ", "|_ _|", " | | ", " | | ", "|___|"],
    H: [" _   _ ", "| | | |", "| |_| |", "|  _  |", "|_| |_|"],
    U: [" _   _ ", "| | | |", "| | | |", "| |_| |", " \\___/ "],
    " ": ["   ", "   ", "   ", "   ", "   "],
  };
  const word = (w) => [0, 1, 2, 3, 4].map((r) => [...w].map((c) => L[c][r]).join(""));
  function logoText() {
    const one = word("SWEDISH SUEDE");
    return innerWidth < 700 ? [...word("SWEDISH"), "", ...word("SUEDE")].join("\n") : one.join("\n");
  }
  function assembleLogo() {
    const final = logoText(), el = $("logo");
    if (calm) { el.textContent = final; return; }
    const cells = [...final], order = cells.map((_, i) => i).filter((i) => cells[i] !== " " && cells[i] !== "\n");
    const settleAt = new Map(order.map((i) => [i, 120 + Math.random() * 900]));
    const start = performance.now();
    const step = (now) => {
      const e = now - start; let done = true;
      el.textContent = cells.map((c, i) => { if (!settleAt.has(i)) return c; if (e >= settleAt.get(i)) return c; done = false; return rnd(); }).join("");
      if (!done) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  // occasional shimmer: a few logo characters flicker and settle back
  setInterval(() => {
    if (calm || document.body.dataset.view !== "title") return;
    const el = $("logo"), final = logoText(), cells = [...final];
    const idx = cells.map((c, i) => (c !== " " && c !== "\n" ? i : -1)).filter((i) => i >= 0);
    const pick = new Set(Array.from({ length: 6 }, () => idx[(Math.random() * idx.length) | 0]));
    el.textContent = cells.map((c, i) => (pick.has(i) ? rnd() : c)).join("");
    setTimeout(() => { el.textContent = final; }, 110);
  }, 1800);
  addEventListener("resize", () => { if (document.body.dataset.view === "title") $("logo").textContent = logoText(); });

  // ---------- sections ----------
  const AREAS = [
    { id: "overview", label: "OVERVIEW", desc: "where the project stands", unlocked: true },
    { id: "data", label: "DATA VAULT", desc: "16 seasons, quality-checked", unlocked: true },
    { id: "xg", label: "EXPECTED GOALS", desc: "the shot-quality model, held-out", unlocked: !!D.xg },
    { id: "experiments", label: "EXPERIMENTS", desc: "windows, EDGE, layered models", unlocked: !!D.experiments,
      need: "Phase 2-4 results: experiments run on held-out seasons with bootstrap confidence intervals." },
    { id: "games", label: "GAME EXPLORER", desc: "held-out predictions, game by game", unlocked: !!D.predictions,
      need: "held-out predictions from the Phase 2 baselines." },
    { id: "calc", label: "WHAT-IF CALCULATOR", desc: "move the dials, watch the odds", unlocked: !!D.model,
      need: "a trained model with exported coefficients (Baseline B)." },
    { id: "settings", label: "SETTINGS", desc: "theme, effects", unlocked: true, meta: true },
  ];
  const explorable = AREAS.filter((a) => !a.meta);
  let found = new Set((store.get("suede.found") || "").split(",").filter((x) => explorable.some((a) => a.id === x && a.unlocked)));
  function hud() {
    $("found").textContent = found.size; $("areas").textContent = explorable.length;
    $("menu-count").textContent = `${found.size}/${explorable.length} AREAS DISCOVERED`;
  }
  $("rev").textContent = D.git_rev;
  $("build").textContent = `built ${D.built_at}`;

  // ---------- menu ----------
  let sel = 0;
  function renderMenu() {
    $("items").innerHTML = AREAS.map((a, i) => {
      const chip = !a.unlocked ? `<span class="chip lock">LOCKED</span>` : a.meta ? "" : found.has(a.id) ? `<span class="chip">explored</span>` : `<span class="chip new">NEW</span>`;
      return `<li><button class="mi${a.unlocked ? "" : " locked"}" type="button" data-i="${i}" aria-current="${i === sel}">` +
        `<span class="cur" aria-hidden="true">&gt;</span><span><span class="lbl" data-label="${esc(a.label)}">${esc(a.label)}</span>` +
        `<span class="desc">${esc(a.desc)}</span></span>${chip}</button></li>`;
    }).join("");
  }
  function select(i, focus = true) {
    sel = (i + AREAS.length) % AREAS.length;
    document.querySelectorAll("button.mi").forEach((b) => b.setAttribute("aria-current", +b.dataset.i === sel ? "true" : "false"));
    const b = document.querySelector(`button.mi[data-i="${sel}"]`);
    if (focus && b) b.focus({ preventScroll: true });
    if (b && !calm) glitch(b.querySelector(".lbl"));
  }
  function glitch(el) {
    const final = el.dataset.label, start = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - start) / 260), n = Math.floor(p * final.length);
      el.textContent = final.slice(0, n) + final.slice(n).replace(/\S/g, rnd);
      if (p < 1) requestAnimationFrame(step); else el.textContent = final;
    };
    requestAnimationFrame(step);
  }
  $("items").addEventListener("click", (e) => { const b = e.target.closest("button.mi"); if (b) { select(+b.dataset.i, false); openArea(AREAS[sel]); } });
  $("items").addEventListener("pointerover", (e) => { const b = e.target.closest("button.mi"); if (b && +b.dataset.i !== sel) select(+b.dataset.i, false); });

  // ---------- routing ----------
  function show(view) {
    document.body.dataset.view = view;
    $("title").hidden = view !== "title"; $("menu").hidden = view !== "menu"; $("panel").hidden = view !== "panel";
    field.setDim(view === "panel" ? .35 : view === "menu" ? .75 : 1);
  }
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    if (!h) { show("title"); assembleLogo(); return; }
    if (h === "menu") { show("menu"); renderMenu(); hud(); select(sel); return; }
    const a = AREAS.find((x) => x.id === h);
    if (!a) { location.hash = "#/menu"; return; }
    sel = AREAS.indexOf(a); renderPanel(a);
  }
  addEventListener("hashchange", route);
  function openArea(a) { location.hash = "#/" + a.id; }
  $("start").addEventListener("click", (e) => { field.burst(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2); location.hash = "#/menu"; });
  $("back").addEventListener("click", () => { location.hash = "#/menu"; });

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const view = document.body.dataset.view;
    if (view === "title" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = "#/menu"; return; }
    if (view === "menu") {
      if (e.key === "ArrowDown" || e.key === "s") { e.preventDefault(); select(sel + 1); }
      else if (e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); select(sel - 1); }
      else if (/^[1-7]$/.test(e.key)) select(+e.key - 1);
      else if (e.key === "Escape") location.hash = "";
      return;
    }
    if (view === "panel" && (e.key === "Escape" || (e.key === "Backspace" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)))) {
      e.preventDefault(); location.hash = "#/menu";
    }
  });

  // ---------- toast ----------
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

  // ---------- panel reveal: content materializes out of ascii noise ----------
  function reveal() {
    const body = $("p-body");
    if (calm) return;
    const pre = document.createElement("pre"); pre.id = "noise"; body.appendChild(pre);
    const probe = document.createElement("span"); probe.textContent = "MMMMMMMMMM"; pre.appendChild(probe);
    const cw = probe.getBoundingClientRect().width / 10 || 8; probe.remove();
    const r = body.getBoundingClientRect();
    const cols = Math.ceil(r.width / cw), rows = Math.ceil(Math.max(r.height, body.scrollHeight) / 15);
    let grid = Array.from({ length: rows }, () => Array.from({ length: cols }, rnd));
    const start = performance.now(), dur = 520;
    const step = (now) => {
      const p = Math.min(1, (now - start) / dur);
      grid = grid.map((row, j) => row.map((c) => (c !== " " && Math.random() < p * p * .5 + (j / rows) * p * .2 ? " " : c)));
      pre.textContent = grid.map((row) => row.join("")).join("\n");
      pre.style.opacity = String(1 - p * .6);
      if (p < 1) requestAnimationFrame(step); else pre.remove();
    };
    requestAnimationFrame(step);
  }

  // ---------- panel renderers ----------
  const asciiBar = (frac, n) => { const k = Math.round(Math.max(0, Math.min(1, frac)) * n);
    return `<span class="fl">${"#".repeat(k)}</span><span class="tr">${".".repeat(n - k)}</span>`; };
  const lockArt = "    ______\n   / ____ \\\n  / /    \\ \\\n _| |____| |_\n|            |\n|    [##]    |\n|     ||     |\n|____________|";  // every row centred on the same column

  const RENDER = {
    overview(body) {
      const latest = D.xg ? D.xg.rows[D.xg.rows.length - 1] : null;
      const tiles = [["Regular-season games", fmt(total), `${S[0].label} to ${S[S.length - 1].label}`],
        ["Seasons processed", `${processed.length}/${S.length}`, "quality-checked, published"],
        ["Raw data downloaded", pct((pbp + sh) / (2 * total), 0), "play-by-play + shift charts"],
        latest ? ["xG log loss", latest.xg.toFixed(4), `held-out ${latest.label}`] : ["xG log loss", "-", "not evaluated yet"]];
      const PH = [["0", "Data discovery", "done"], ["1", "Dataset and features", "wip"], ["2", "Baselines", "todo"],
                  ["3", "Model families", "todo"], ["4", "Experiments", "todo"], ["5", "Market backtest", "deferred"]];
      const ico = { done: ["[x]", "done", "done"], wip: ["[~]", "wip", "in progress"], todo: ["[ ]", "", "not started"], deferred: ["[-]", "", "deferred: no odds"] };
      body.innerHTML = `<p class="sub">Every number here is read from files on disk when the page is built. Sections without real results stay locked.</p>` +
        `<div class="tiles">${tiles.map(([k, v, s]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join("")}</div>` +
        `<div class="grid2"><div class="card"><h3>Download progress</h3><div id="progress"></div></div>` +
        `<div class="card"><h3>Phases</h3><ol class="phases">${PH.map(([n, name, st]) =>
          `<li><span class="ph-ico ${ico[st][1]}">${ico[st][0]}</span><span>Phase ${n} &middot; ${esc(name)}</span><span class="chip">${ico[st][2]}</span></li>`).join("")}</ol></div></div>`;
      const w = $("progress").getBoundingClientRect().width, n = Math.max(12, Math.min(60, Math.floor(w / 8.2)));
      $("progress").innerHTML = [["Play-by-play", pbp], ["Shift charts", sh]].map(([k, c]) =>
        `<div style="margin:6px 0 12px"><div class="prog-head"><span>${k}</span><span class="mono">${fmt(c)} / ${fmt(total)}</span></div>
         <div class="prog" tabindex="0" data-tip="${esc(`${k}: ${fmt(c)} of ${fmt(total)} games (${pct(c / total)})`)}">${asciiBar(c / total, n)}</div></div>`).join("") +
        `<div class="prog">goalie data (bulk): <span class="fl">complete</span>, all ${S.length} seasons</div>`;
    },

    data(body) {
      const dl = (s) => Math.min(s.pbp_downloaded, s.shifts_downloaded) / s.games;
      const COLS = [
        ["Season", (s) => s.season, (s) => esc(s.label)],
        ["Games", (s) => s.games, (s) => fmt(s.games)],
        ["Downloaded", dl, (s) => { const k = Math.round(dl(s) * 10); return `<span class="mini">${"#".repeat(k)}${".".repeat(10 - k)}</span>${pct(dl(s), 0)}`; }],
        ["Goals", (s) => s.goals_match, (s) => (s.processed ? pct(s.goals_match) : null)],
        ["Starters", (s) => s.two_starters, (s) => (s.processed ? pct(s.two_starters) : null)],
        ["Shift flags", (s) => s.shifts_flagged, (s) => (s.processed ? (s.shifts_flagged ? `<span class="flag">${s.shifts_flagged}</span>` : "0") : null)],
        ["Shots w/ xy per game", (s) => s.shots_xy_per_game, (s) => (s.processed ? s.shots_xy_per_game.toFixed(1) : null)],
        ["Home win %", (s) => s.home_win_rate, (s) => pct(s.home_win_rate)],
      ];
      let sortCol = 0, sortDir = -1;
      body.innerHTML = `<p class="sub">One row per regular season; click a column to sort. <b>Goals</b>: games where play-by-play goals equal the final score. ` +
        `<b>Starters</b>: games with exactly two starting goalies. <b>Shift flags</b>: shift charts failing the team time-on-ice check (features skip their shift-based stats).</p>` +
        `<div class="card tbl-wrap"><table class="data" id="dq"></table></div>`;
      const draw = () => {
        const key = COLS[sortCol][1];
        const rows = S.slice().sort((a, b) => { const x = key(a), y = key(b);
          if (x == null || y == null) return (x == null) - (y == null); return (x - y) * sortDir; });
        $("dq").innerHTML = `<caption class="sr">Data quality by season</caption><thead><tr>${COLS.map(([h], i) =>
          `<th scope="col" aria-sort="${i === sortCol ? (sortDir > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-sort="${i}">${esc(h)}</button></th>`).join("")}</tr></thead>` +
          `<tbody>${rows.map((s) => `<tr>${COLS.map(([, , f]) => { const v = f(s); return v == null ? `<td class="pending">pending</td>` : `<td>${v}</td>`; }).join("")}</tr>`).join("")}</tbody>`;
      };
      $("dq").addEventListener("click", (e) => { const b = e.target.closest("[data-sort]"); if (!b) return;
        const i = +b.dataset.sort; sortDir = i === sortCol ? -sortDir : -1; sortCol = i; draw(); });
      draw();
    },

    xg(body) {
      const SERIES = [["xG model", "xg", "--s1", "#"], ["Distance + angle", "distance", "--s2", "="], ["Constant rate", "constant", "--s3", ":"]];
      const R = D.xg.rows, max = Math.max(...R.flatMap((r) => SERIES.map(([, k]) => r[k])));
      body.innerHTML = `<p class="sub">Log loss per shot on each <b>held-out season</b>; each season's model is trained only on earlier seasons. Lower is better; bars start at zero.</p>` +
        `<div class="card"><div class="legend">${SERIES.map(([n, , c, g]) => `<span><span class="sw" style="--c:var(${c})">${g}</span>${esc(n)}</span>`).join("")}</div>` +
        R.slice().reverse().map((r) => `<div class="season-group"><div class="season-head"><b>Held-out ${esc(r.label)}</b><span>trained on ${esc(r.train)}</span>` +
          `<span>${fmt(r.n_test)} shots</span><span class="chip" tabindex="0" data-tip="Sum of predicted xG divided by actual goals in ${esc(r.label)}. 1.000 means calibrated in total.">total xG / goals ${r.xg_over_goals.toFixed(3)}</span></div>` +
          SERIES.map(([n, k, c, g]) => `<div class="bar-row" tabindex="0" data-tip="${esc(`${n}\nheld-out ${r.label}: log loss ${r[k].toFixed(4)}\n${fmt(r.n_test)} shots`)}">` +
            `<span class="lab">${esc(n)}</span><span class="bar-track"><span class="bar-fill" style="--c:var(${c})" data-w="${(100 * r[k] / max).toFixed(2)}" data-tex="${g.repeat(140)}"></span></span>` +
            `<span class="val">${r[k].toFixed(4)}</span></div>`).join("") + "</div>").join("") +
        `<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--ink-2)">Table view</summary><div class="tbl-wrap"><table class="data" style="margin-top:8px">` +
        `<thead><tr><th>Held-out season</th><th>Trained on</th><th>Shots</th><th>xG</th><th>Distance</th><th>Constant</th><th>xG / goals</th></tr></thead><tbody>${
          R.map((r) => `<tr><td>${esc(r.label)}</td><td>${esc(r.train)}</td><td>${fmt(r.n_test)}</td><td>${r.xg.toFixed(4)}</td><td>${r.distance.toFixed(4)}</td><td>${r.constant.toFixed(4)}</td><td>${r.xg_over_goals.toFixed(3)}</td></tr>`).join("")}</tbody></table></div></details>` +
        `<div style="margin-top:8px;font-size:12px;color:var(--muted)">source: results/xg_eval.csv, modified ${esc(D.xg.modified)}</div></div>`;
      const bars = body.querySelectorAll(".bar-fill");
      setTimeout(() => bars.forEach((b, i) => setTimeout(() => { b.style.width = b.dataset.w + "%"; }, calm ? 0 : i * 55)), calm ? 0 : 380);
    },

    settings(body) {
      body.innerHTML = `<div class="card">
        <div class="opt"><div><div>Theme</div><div class="d">Dark is the house look.</div></div>
          <div class="seg" id="seg-theme"><button type="button" data-v="dark">dark</button><button type="button" data-v="light">light</button></div></div>
        <div class="opt"><div><div>Effects</div><div class="d">${osReduced ? "Off: your system asks for reduced motion." : "Field animation, decoding text, reveals."}</div></div>
          <div class="seg" id="seg-fx"><button type="button" data-v="on">on</button><button type="button" data-v="off">off</button></div></div>
        <div class="opt"><div><div>Discoveries</div><div class="d">${found.size} of ${explorable.length} areas explored on this device.</div></div>
          <button class="btn" type="button" id="reset">reset</button></div></div>`;
      const sync = () => {
        $("seg-theme").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === theme)));
        $("seg-fx").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === (calm ? "off" : "on"))));
      };
      $("seg-theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; theme = b.dataset.v; store.set("suede.theme", theme); applyTheme(); sync(); });
      $("seg-fx").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b || osReduced) return;
        calm = b.dataset.v === "off"; store.set("suede.fx", calm ? "off" : "on"); applyCalm(); sync(); });
      $("reset").addEventListener("click", () => { found = new Set(); store.set("suede.found", ""); hud(); toast("DISCOVERIES RESET"); RENDER.settings(body); });
      sync();
    },
  };
  function renderLocked(body, a) {
    body.innerHTML = `<div class="locked-box"><pre aria-hidden="true">${esc(lockArt)}</pre><div><h3>${esc(a.label)} is locked</h3>` +
      `<p>Unlocks when the project has ${esc(a.need)}</p><p>No placeholder numbers: this area opens itself once the real results are on disk.</p>` +
      `<span class="chip lock">LOCKED</span></div></div>`;
  }

  function renderPanel(a) {
    show("panel");
    $("p-idx").textContent = String(AREAS.indexOf(a) + 1).padStart(2, "0");
    $("p-title").textContent = a.label;
    const body = $("p-body"); body.scrollTop = 0;
    if (!a.unlocked) renderLocked(body, a); else RENDER[a.id](body);
    reveal();
    $("back").focus({ preventScroll: true });
    if (a.unlocked && !a.meta && !found.has(a.id)) {
      found.add(a.id); store.set("suede.found", [...found].join(","));
      setTimeout(() => toast(`NEW AREA DISCOVERED  ${found.size}/${explorable.length}`), calm ? 0 : 420);
    }
    hud();
  }

  // ---------- tooltip (hover + focus) ----------
  const tip = $("tip");
  function showTip(text, x, y) { tip.textContent = text; tip.classList.add("on"); const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - r.width - 8)) + "px"; tip.style.top = Math.max(8, Math.min(y + 16, innerHeight - r.height - 8)) + "px"; }
  document.addEventListener("pointermove", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else tip.classList.remove("on"); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el.dataset.tip, r.left, r.bottom); } });
  document.addEventListener("focusout", () => tip.classList.remove("on"));

  hud();
  route();
})();
</script>
</body>
</html>
